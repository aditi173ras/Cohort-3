<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Piano</title>
    <link rel="stylesheet" href="style.css" />
  class
  <body>
    <h1>Virtual Piano</h1>
    <main>
      <div class="piano">
        <div class="white-notes A">C</div>
        <div class="white-notes S">D</div>
        <div class="white-notes D">E</div>
        <div class="white-notes F">F</div>
        <div class="white-notes G">G</div>
        <div class="white-notes H">A</div>
        <div class="white-notes J">B</div>
        <div class="white-notes K">C</div>
        <div class="white-notes L">D</div>
        <div class="white-notes ;">E</div>

        <!-- Black Keys -->
        <div class="black-notes W" id="note-CMinor1">C#</div>
        <div class="black-notes E" id="note-DMinor1">D#</div>
        <div class="black-notes T" id="note-FMinor">F#</div>
        <div class="black-notes Y" id="note-GMinor">G#</div>
        <div class="black-notes U" id="note-AMinor">A#</div>
        <div class="black-notes O" id="note-CMinor2">C#</div>
        <div class="black-notes P" id="note-DMinor2">D#</div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
